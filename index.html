<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCB</title>
<meta name="theme-color" content="#F5F1E6">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CCB">

<style>
:root{--bg:#F5F1E6;--panel:#fff;--raised:#F0EAD6;--line:#E4DFD0;--yellow:#F2B705;--yellow-dim:#C99A08;--gold:#B8860B;--badge:#FBF0CE;--text:#2B2B26;--dim:#8A8271;--green:#4CAF7D;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1C17;--panel:#2A2720;--raised:#343026;--line:#413C30;--badge:#4A3F18;--text:#F1ECDD;--dim:#A39B87;--gold:#E3B341;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1C17;--panel:#2A2720;--raised:#343026;--line:#413C30;--badge:#4A3F18;--text:#F1ECDD;--dim:#A39B87;--gold:#E3B341;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:420px;margin:0 auto;min-height:100vh;padding:0 18px 28px}
header{padding:26px 2px 16px}
.brand-line{display:flex;align-items:center;gap:8px}
.brand-dash{width:22px;height:3px;background:var(--yellow);border-radius:2px}
.brand{font-size:13px;letter-spacing:.08em;color:var(--gold);font-weight:700}
h1{font-size:23px;margin:9px 0 2px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
h2{font-size:18px;margin:0;font-weight:700}
.screen{display:none}.screen.on{display:block}
.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:8px 0 16px}
.entry-btn{aspect-ratio:1.45;border-radius:20px;background:var(--panel);color:var(--text);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:800;font-size:13.5px;cursor:pointer;box-shadow:0 14px 28px -14px rgba(0,0,0,.35);transition:transform .12s}
.entry-btn:active{transform:scale(.96)}
.icon-badge{width:42px;height:42px;border-radius:13px;background:var(--badge);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.icon-badge svg{width:24px;height:24px}
.top-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back-btn{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.field{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--dim);font-weight:600;margin-bottom:6px}
.field input[type=date]{width:100%;font:inherit;font-size:16px;color:var(--text);background:transparent;border:none;outline:none}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row.org{background:var(--raised);border-radius:0 0 14px 14px;font-weight:700}
.lf{display:flex;align-items:center;gap:10px;min-width:0;flex:1;padding-right:8px}
.ic{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:var(--badge);color:var(--gold);display:flex;align-items:center;justify-content:center}
.ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nm{font-size:14.5px;font-weight:600;line-height:1.2}
.step{display:flex;align-items:center;gap:10px}
.step button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--text);font:inherit;font-size:20px;font-weight:700;cursor:pointer;line-height:1}
.step button:active{transform:scale(.92)}
.step b{min-width:24px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;background:var(--badge);border-radius:14px;padding:12px 16px;margin-bottom:12px;font-weight:700}
.preview{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;line-height:1.5;margin:0 0 12px;font-family:inherit}
.acts{display:flex;gap:10px}
.btn{flex:1;padding:15px;border-radius:16px;border:none;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-align:center;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.main{background:linear-gradient(155deg,var(--yellow),var(--yellow-dim));color:#181300}
.btn.wa{background:var(--green);color:#06210f}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);flex:0 0 auto;padding:15px 18px}
#app{display:flex;flex-direction:column}
.foot{text-align:center;font-size:12px;color:var(--dim);padding:4px 0 8px;margin-top:22px}
.sv-title{font-size:13px;font-weight:700;color:var(--dim);margin:16px 2px 8px}
.sv{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.sv:last-child{border-bottom:none}
.sv .d{font-weight:700;font-size:15px}
.sv .m{font-size:12px;color:var(--dim);margin-top:2px}
.sv .x{background:none;border:none;color:var(--dim);font:inherit;font-size:13px;padding:8px;cursor:pointer}
.box-h{padding:12px 14px 8px;font-weight:800;font-size:15px;text-align:center;border-bottom:1px solid var(--line)}
.empty{padding:14px;font-size:13px;color:var(--dim)}
.ok{text-align:center;font-size:13px;color:var(--dim);min-height:18px;margin-top:10px}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand-line"><div class="brand-dash"></div><div class="brand">CCB</div><div class="brand" id="today" style="color:var(--dim);font-weight:600;margin-left:6px"></div></div>
  <h1>Relatório Musical</h1>
</header>

<div class="screen on" id="menu">
  <div class="entry-grid">
    <button class="entry-btn" id="open-rel">
      <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5M9 13h6M9 17h6"/></svg></div>
      <span>Culto</span>
    </button>
  </div>
</div>

<div class="screen" id="rel">
  <div class="top-row">
    <button class="back-btn" id="back" aria-label="Voltar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h2 id="rtitle">Culto</h2>
  </div>
  <div class="field"><label for="dt">Data</label><input type="date" id="dt"></div>
  <div class="list" id="inst"></div>
  <div class="sum"><span id="s-mus"></span><span id="s-tot"></span></div>
  <div class="list" id="cant" style="display:none"></div>
  <div class="list" id="rec" style="display:none"></div>
  <div class="list" id="min" style="display:none"></div>
  <div class="list" id="gem" style="display:none"></div>
  <div class="list" id="bat" style="display:none"></div>
  <div class="list" id="pbox" style="display:none"></div>
  <div class="field" id="ant" style="display:none"><label for="dt2">Data do batismo anterior</label><input type="date" id="dt2"></div>
  <pre class="preview" id="prev"></pre>
  <div class="acts">
    <button class="btn main" id="copy">Copiar para o Zap</button>
    <button class="btn wa" id="save">Salvar</button>
    <button class="btn ghost" id="zero">Zerar</button>
  </div>
  <div class="ok" id="ok"></div>
  <div class="sv-title">Salvos</div>
  <div class="list" id="salvos"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>

try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv)for(var k in sv)if(k in cnt)cnt[k]=sv[k]|0}catch(e){}

function showInst(){if(!isStandalone)iw.style.display='block'}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;showInst()});
window.addEventListener('appinstalled',function(){iw.style.display='none';deferredPrompt=null});
if(isMobile)showInst();
$('instbtn').onclick=function(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){deferredPrompt=null;iw.style.display='none'});return}
  $('insthelp').textContent=isIOS?'No iPhone: toque em Compartilhar (o quadrado com a seta) e depois em “Adicionar à Tela de Início”.':'Toque nos três pontinhos do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.';
};
</script>
</body>
</html>
